[project]
name = "ocfreeproxy"
version = "0.1.0"
description = "OpenCode Free model reverse proxy with proxy pool, cooldown, and web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "socksio>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ocfreeproxy = "ocfreeproxy.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocfreeproxy"]
